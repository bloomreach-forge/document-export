<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:head>
  <wicket:link>
    <link rel="stylesheet" type="text/css" href="ExportJsonDialog.css"/>
  </wicket:link>
</wicket:head>
<body>
<wicket:extend>
    <p wicket:id="message" class="message"></p>

    <div class="checkbox">
        <input type="checkbox" wicket:id="prettyPrint" id="prettyPrint" />
        <label for="prettyPrint" style="cursor: pointer; margin: 0;">Pretty-print JSON</label>
    </div>

    <div class="button">
        <a wicket:id="downloadButton">Download JSON</a>
    </div>
</wicket:extend>
</body>
</html>
