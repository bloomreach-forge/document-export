<?xml version="1.0" encoding="UTF-8"?>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:head>
  <wicket:link>
    <link rel="stylesheet" type="text/css" href="ExportTabularDialog.css"/>
  </wicket:link>
</wicket:head>
<body>
<wicket:extend>
    <p wicket:id="message" class="message"></p>
    <div class="checkbox">
        <input type="checkbox" wicket:id="includeHeaders" id="includeHeaders" />
        <label for="includeHeaders">Include headers</label>
    </div>
    <div class="checkbox">
        <input type="checkbox" wicket:id="quoteAll" id="quoteAll" />
        <label for="quoteAll">Quote all values</label>
    </div>
    <div class="button">
        <a wicket:id="downloadButton">Download File</a>
    </div>
</wicket:extend>
</body>
</html>
